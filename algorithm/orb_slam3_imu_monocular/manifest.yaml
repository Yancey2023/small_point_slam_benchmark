schema_version: 1
name: ORB-SLAM3 (imu monocular)
shared_source: orb_slam3_monocular
description: Feature-based monocular-inertial multi-map SLAM with a headless standalone adapter.
authors: [Carlos Campos, Richard Elvira, Juan J. Gómez Rodríguez, José M. M. Montiel, Juan D. Tardós]
license: GPL-3.0
repository:
  name: ORB_SLAM3
  url: https://github.com/UZ-SLAMLab/ORB_SLAM3.git
  ref: 4452a3c4ab75b1cde34e5505a36ec3f9edcdc4c4
dependencies:
  - {name: Eigen, url: https://gitlab.com/libeigen/eigen.git}
  - {name: OpenCV, url: https://github.com/opencv/opencv.git}
  - {name: spdlog, url: https://github.com/gabime/spdlog.git}
  - {name: DBoW2, url: https://github.com/dorian3d/DBoW2.git}
  - {name: g2o, url: https://github.com/RainerKuemmerle/g2o.git}
paper:
  title: "ORB-SLAM3: An Accurate Open-Source Library for Visual, Visual-Inertial, and Multimap SLAM"
  url: https://doi.org/10.1109/TRO.2021.3075644
sensors: [camera, imu]
timing_stages: [imu_preprocess, image_preprocess, visual_tracking]
integration:
  status: integrated
  transport: core_sensor_samples
  build_requirement: Builds the upstream headless monocular-inertial library and bundled DBoW2/g2o from the shared pinned official source.
