schema_version: 1
name: BIEVR-LIO
description: Robust LiDAR-inertial odometry using bump-image-enhanced voxel maps and map-informed sampling.
authors: [ETH Zurich Autonomous Systems Lab]
license: BSD-3-Clause
repository:
  name: BIEVR-LIO
  url: https://github.com/ethz-asl/BIEVR-LIO.git
