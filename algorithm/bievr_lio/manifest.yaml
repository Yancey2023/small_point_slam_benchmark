source_excludes: [interfaces, docker, BIEVR/package.xml]
dependencies:
  - {name: Ceres Solver, url: https://github.com/ceres-solver/ceres-solver.git}
  - {name: Eigen, url: https://gitlab.com/libeigen/eigen.git}
paper:
  title: "BIEVR-LIO: Robust LiDAR-Inertial Odometry through Bump-Image-Enhanced Voxel Maps"
