schema_version: 1
name: Small Point SLAM
description: Generalized point-wise SLAM using N LiDARs plus one optional IMU, camera and wheel-speed source.
authors: [Yingjie Huang]
license: Proprietary
repository:
  name: navigation
  url: ""
  local_path: /home/yancey/cpp/navigation
  local_path_env: SMALL_POINT_SLAM_SOURCE_DIR
  ref: e24b04452966f24fa221b2558e0ffc6281abdf5d
source_excludes:
  - livox_custom_msg_ws
  - tests
  - unused
  - web
  - apps/dump_lidar_frames.cpp
  - apps/run_gazebo_simulation.cpp
  - apps/run_rosbag.cpp
  - src/io/ros_image_decoder.cpp
  - src/io/ros_image_decoder.h
  - src/io/rosbag_progress.h
  - 3rdparty/rosbag_io
dependencies:
  - {name: Eigen, url: https://gitlab.com/libeigen/eigen.git}
  - {name: oneTBB, url: https://github.com/uxlfoundation/oneTBB.git}
  - {name: small_gicp, url: https://github.com/koide3/small_gicp.git}
  - {name: unordered_dense, url: https://github.com/martinus/unordered_dense.git}
paper: {}
sensors: [lidar, imu, camera, wheel_speed]
timing_stages:
  - lidar_preprocess
  - imu_preprocess
  - image_preprocess
  - downsampling
  - state_propagation
  - map_search
  - filter_update
  - map_update
