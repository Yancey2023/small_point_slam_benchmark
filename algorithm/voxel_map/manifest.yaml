schema_version: 1
name: VoxelMap
description: Probabilistic adaptive voxel mapping for LiDAR odometry using plane uncertainty.
authors: [Chongjian Yuan, Wei Xu]
license: GPL-2.0
repository:
  name: VoxelMap
  url: https://github.com/hku-mars/VoxelMap.git
  ref: d787ee8ccfb0e509a36adb2c52bd5da97b29c39a
source_excludes: [Log, config, launch, msg, rviz_cfg, package.xml, src]
dependencies:
  - {name: PCL, url: https://github.com/PointCloudLibrary/pcl.git}
  - {name: Eigen, url: https://gitlab.com/libeigen/eigen.git}
paper:
  title: "Efficient and Probabilistic Adaptive Voxel Mapping for Accurate Online LiDAR Odometry"
  url: https://arxiv.org/abs/2109.07082
sensors: [lidar]
timing_stages:
  - lidar_preprocess
  - downsampling
  - map_search
  - filter_update
  - map_update
